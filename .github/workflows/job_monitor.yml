name: Job Monitor France (Tarbes)

on:
  schedule:
    # Запуск каждые 15 минут круглосуточно на серверах GitHub Actions
    - cron: '*/15 * * * *'
  workflow_dispatch: # Кнопка "Run workflow" для ручного запуска в браузере

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seen jobs database
        uses: actions/cache@v4
        with:
          path: jobs_data.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run Job Hunter Scanner & Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          DEFAULT_CITY: 'Tarbes'
          DEFAULT_POSTAL_CODE: '65000'
          DEFAULT_RADIUS_KM: '15'
        run: |
          python run_cloud_cron.py
